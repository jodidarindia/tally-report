# /etc/nginx/sites-available/flowra
#
# Serves the React build directly and reverse-proxies /api/* to uvicorn.
# certbot --nginx will splice in the SSL block on first run.

server {
    listen 80;
    server_name insights.flowralive.in;

    # allow big Tally-agent uploads (invoice PDFs, backups)
    client_max_body_size 60m;
    client_body_timeout 90s;

    # Gzip static assets so a 4G connection in Karol Bagh still feels snappy
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # React SPA
    root /var/www/flowra;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Long-cache the hashed CRA assets
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Desktop agent + release manifest
    location = /FlowraTallyAgent.exe {
        add_header Content-Disposition "attachment";
        expires 1d;
    }

    # Backend — every /api call goes here
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # for AI Draft (GPT-5.2 ~15s) + Forecast (~30s)
        proxy_send_timeout 120s;
    }
}
