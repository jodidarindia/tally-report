services:
  mongodb:
    image: mongo:7
    container_name: flowra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - flowra-network

  backend:
    build: ./backend
    container_name: flowra-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=tally_reports
      - CORS_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET:-flowra_secret_key_change_me}
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY}
    depends_on:
      - mongodb
    networks:
      - flowra-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${APP_URL:-http://localhost}
    container_name: flowra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - flowra-network

volumes:
  mongo_data:

networks:
  flowra-network:
    driver: bridge
