version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: tally-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tally-network

  backend:
    build: ./backend
    container_name: tally-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=tally_reports
      - CORS_ORIGINS=*
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-re_placeholder}
      - SENDER_EMAIL=${SENDER_EMAIL:-onboarding@resend.dev}
    depends_on:
      - mongodb
    networks:
      - tally-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${APP_URL:-http://localhost}
    container_name: tally-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tally-network

volumes:
  mongo_data:

networks:
  tally-network:
    driver: bridge
