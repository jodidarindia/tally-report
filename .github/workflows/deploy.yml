name: Deploy to DigitalOcean

# Triggers:
#   1. Every push to `main`     → auto-deploys prod
#   2. Manual "Run workflow"    → the "click-of-a-button" republish you asked for
#      (Actions tab → Deploy to DigitalOcean → Run workflow)
on:
  push:
    branches: [main]
    paths-ignore:
      # iter-127: Emergent + agent-testing infra auto-stamps these files
      # after every run. Ignoring them here prevents a "no code changed"
      # push from firing a full ~2-minute deploy for nothing.
      - '.emergent/**'
      - 'memory/**'
      - 'test_reports/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      restart_only:
        description: "Skip git pull + build, just restart services"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: prod-deploy
  cancel-in-progress: false     # never abort an in-flight deploy

jobs:
  deploy:
    name: SSH → build → restart
    runs-on: ubuntu-latest
    environment: production      # so GitHub prompts for approval if you turn on required reviews

    steps:
      - name: Checkout (for the deploy scripts only)
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DO_HOST:      ${{ secrets.DO_HOST }}
          DO_USER:      ${{ secrets.DO_USER }}
          RESTART_ONLY: ${{ inputs.restart_only || 'false' }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DO_USER@$DO_HOST" \
              "cd /opt/flowra && ./deploy/deploy.sh $RESTART_ONLY"

      - name: Smoke test
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          # iter-127: retry the health probe with backoff — cold uvicorn
          # startup on a 2-vCPU Droplet can take 15–20 s (deps load +
          # Mongo index ensure), so a single curl was flaking healthy
          # deploys as failed.
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -fsSL --max-time 10 "https://insights.flowralive.in/api/health" || true)
            echo "attempt $i → $body"
            if echo "$body" | grep -q '"ok":true'; then
              echo "✅ Backend healthy"
              break
            fi
            sleep 5
          done
          # iter-131: also verify the FRONTEND bundle actually refreshed
          # to the commit we just pushed. Silent stale-frontend bug —
          # see deploy.sh comments.
          echo "── Frontend version stamp ──"
          FE_VERSION=$(curl -fsSL --max-time 10 "https://insights.flowralive.in/version.txt" 2>/dev/null || echo "MISSING")
          echo "Deployed frontend version: $FE_VERSION"
          EXPECTED_SHA="$(git rev-parse --short "${GITHUB_SHA}")"
          if echo "$FE_VERSION" | grep -q "$EXPECTED_SHA"; then
            echo "✅ Frontend serving $EXPECTED_SHA — deploy complete"
            exit 0
          fi
          echo "❌ Frontend still on old bundle (expected $EXPECTED_SHA, got: $FE_VERSION)"
          echo "   Check deploy logs — yarn build likely failed silently."
          exit 1
